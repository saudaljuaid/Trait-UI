<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Files">
  <!--
    THE FILES MARK, IN THE SAME GEOMETRY AS PHIPIA'S OWN.

    A drawer pulled open with papers standing in it, seen from the angle
    the Phipia mark's panels are seen from.  The papers are FANNED rather
    than stacked square: two upright rectangles read as blank boxes at 22
    pixels, which is what the first cut of this did, and a slight lean
    reads as paper.

    Grey on grey rather than a bright folder, because the desktop it sits
    on is the grey Debian one and a saturated mark would be the only loud
    thing on the bar.
  -->
  <defs>
    <linearGradient id="f-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#949AA3"/>
      <stop offset="1" stop-color="#616771"/>
    </linearGradient>
    <linearGradient id="f-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#767C87"/>
      <stop offset="0.55" stop-color="#4B5058"/>
      <stop offset="1" stop-color="#383C43"/>
    </linearGradient>
    <linearGradient id="f-sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFD3D8"/>
    </linearGradient>
  </defs>

  <!-- the papers, fanned, standing in the drawer -->
  <g stroke="#575D66" stroke-width="1.1" stroke-linejoin="round">
    <path d="M13.2 12.6 L24.6 9.4 L28.8 26.5 L17.4 29.7 Z"
          fill="url(#f-sheet)"/>
    <path d="M22.5 6.0 L34.2 6.0 L34.2 27.5 L22.5 27.5 Z"
          fill="url(#f-sheet)"/>
  </g>

  <!-- the drawer's back wall -->
  <path d="M6.5 21.5 L41.5 21.5 L41.5 30 L6.5 30 Z"
        fill="url(#f-body)" stroke="#3A3F47" stroke-width="1.1"
        stroke-linejoin="round"/>
  <!-- the front, tilted forward, with the pull across it -->
  <path d="M4.2 25.6 L43.8 25.6 L40.6 42.4 L7.4 42.4 Z"
        fill="url(#f-face)" stroke="#2A2E35" stroke-width="1.2"
        stroke-linejoin="round"/>
  <path d="M5.6 28.2 L42.4 28.2" stroke="#A7ACB4" stroke-width="1"
        opacity="0.55"/>
  <rect x="18" y="32.5" width="12" height="3.6" rx="1.8"
        fill="#C3C8D0" stroke="#2A2E35" stroke-width="0.8"/>
</svg>
