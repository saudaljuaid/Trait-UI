<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 1434" width="1123" height="1434" role="img" aria-label="Phipia">
  <!--
    Phipia's mark.
    Two interlocking brackets seen in a sheared projection, with a third
    panel standing between them - a stack of windows read edge-on.  The
    coordinates are traced from the mark this project was given, on its
    own 1123x1434 frame, so the silhouette is the same shape at any size.
    Corners are rounded because the original's are; at the 22 pixels the
    panel draws it at, the rounding is what keeps the three panels from
    fusing into one blob.
  -->
  <g fill="#6E7073" stroke="#6E7073" stroke-width="26"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- the back bracket, top right -->
    <path d="M472 112 L946 348 L946 1030 L714 924 L714 566 L472 458 Z"/>
    <!-- the front bracket, bottom left -->
    <path d="M160 412 L368 300 L368 664 L252 616 L252 968 L610 1140 L610 1252 L160 1034 Z"/>
    <!-- the panel standing between them -->
    <path d="M408 492 L612 592 L612 1074 L408 974 Z"/>
  </g>
</svg>
