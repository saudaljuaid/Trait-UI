<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent}
svg{display:block}
.word{
  font-family:"DejaVu Sans",sans-serif;
  font-weight:700;
  letter-spacing:-0.015em;
}
.sub{
  font-family:"DejaVu Sans",sans-serif;
  font-weight:400;
  letter-spacing:0.22em;
}
</style></head><body>
<!--
  The logout dialog's banner, at lxsession-logout's own 352x125.
  lxde-common ships one and it is vendored beside the panel's images, but
  it carries LXDE's logo and wordmark - which in a desktop called Trait OS
  would be another project's name on this one's dialog.  So the MECHANISM
  is copied, at the same size and in the same place, and the identity on
  it is this project's.

  THE WALLPAPER'S TOWERS USED TO BE ALONG THE RIGHT EDGE AND THEY ARE GONE.
  They are drawn dark on a light ground and delicate, at a scale where a
  tower is two hundred pixels wide.  Squeezed into a 25-pixel column on a
  dark ground they inverted to near-white and lost every line that made
  them read as towers: what was left was a patch of bright scratches,
  sitting in the loudest part of the contrast range, competing with the
  name for the eye.  A motif that does not survive its own reduction is
  not a smaller version of itself.

  LXDE's own banner is a mark and a wordmark on a plain ground and nothing
  else, and copying the mechanism means copying that restraint too.

  Rendered at 2x - 704x250 - because the dialog sizes it with width:100%,
  so the extra pixels land on any display and cost 30KB once.
-->
<svg width="352" height="125" viewBox="0 0 352 125"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2E3542"/>
      <stop offset="0.55" stop-color="#20252F"/>
      <stop offset="1" stop-color="#13161C"/>
    </linearGradient>
    <!-- A slow highlight behind the mark, so the ground is not a flat
         slab.  It replaces the towers as the thing that keeps the left
         half from being empty, and it cannot be mistaken for detail. -->
    <radialGradient id="glow" cx="0.16" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3A4353" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3A4353" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="352" height="125" fill="url(#sky)"/>
  <rect width="352" height="125" fill="url(#glow)"/>

  <!-- the mark, optically centred on the banner's own midline -->
  <g transform="translate(30,32) scale(0.0425)">
    <g fill="#E8EAEE" stroke="#E8EAEE" stroke-width="26"
       stroke-linejoin="round" stroke-linecap="round">
      <path d="M472 112 L946 348 L946 1030 L714 924 L714 566 L472 458 Z"/>
      <path d="M160 412 L368 300 L368 664 L252 616 L252 968 L610 1140 L610 1252 L160 1034 Z"/>
      <path d="M408 492 L612 592 L612 1074 L408 974 Z"/>
    </g>
  </g>

  <text class="word" x="92" y="65" font-size="37" fill="#F4F6F9">Trait OS</text>
  <text class="sub" x="94" y="85" font-size="9.5" fill="#7F8898">DESKTOP
    ENVIRONMENT</text>
</svg>
</body></html>
