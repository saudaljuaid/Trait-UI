<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  svg { display: block; }
  .wordmark {
    font-family: "DejaVu Sans", sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
</style></head>
<body>
<!--
  THE WALLPAPER, AS VECTOR ART RENDERED BY THE SAME BROWSER THE
  SCREENSHOTS COME FROM.

  IT IS COMPOSED FOR A 4:3 CROP AS WELL AS ITS OWN 16:9.  The desktop
  draws it with background-size: cover, so a 4:3 screen keeps the full
  height and loses 171 pixels off each side; the mark and the tallest
  tower are both inside that margin.  Laid out for 16:9 alone, the first
  screenshot of the 1024x768 desktop had the mark hanging off the left
  edge.

  White ground; the mark and the wordmark at the upper left; and along
  the foot a run of thin-line towers that climb towards the right, each
  one a scatter of straight chords inside a narrowing silhouette.  The
  scatter is SEEDED - the same numbers every time - so the file this
  renders to is reproducible rather than a lucky throw.
-->
<svg id="wp" width="1920" height="1080" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- the mark, same silhouette as the panel's, in the wallpaper's black -->
  <g transform="translate(430,410) scale(0.0763)">
    <g fill="#111111" stroke="#111111" stroke-width="26"
       stroke-linejoin="round" stroke-linecap="round">
      <path d="M472 112 L946 348 L946 1030 L714 924 L714 566 L472 458 Z"/>
      <path d="M160 412 L368 300 L368 664 L252 616 L252 968 L610 1140 L610 1252 L160 1034 Z"/>
      <path d="M408 492 L612 592 L612 1074 L408 974 Z"/>
    </g>
  </g>

  <text class="wordmark" x="532" y="492" font-size="72" fill="#111111">phipia</text>

  <g id="towers" fill="none" stroke-linecap="round"></g>
</svg>
<script>
/*
 * A seeded generator, so this page draws the same wallpaper every time.
 * Mulberry32 - small, and its period is far longer than the few thousand
 * numbers a wallpaper asks of it.
 */
function rng(seed) {
    return function () {
        seed |= 0;
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

const random = rng(20260914);
const towers = document.getElementById("towers");

/*
 * Each tower is a narrow silhouette that leans slightly and tapers as it
 * rises; the lines inside it are chords between two points picked on that
 * silhouette, so the scribble stays inside the shape instead of forming a
 * cloud.  Higher towers carry more lines, which is what makes the run
 * read as a climb rather than as seven of the same thing.
 */
const TOWERS = [
    { x: 700,  top: 940,  width: 170, lines: 60,  lean: 14 },
    { x: 880,  top: 855,  width: 185, lines: 80,  lean: 10 },
    { x: 1130, top: 745,  width: 165, lines: 85,  lean: -8 },
    { x: 1340, top: 620,  width: 165, lines: 120, lean: -6 },
    { x: 1540, top: 355,  width: 195, lines: 190, lean: 4 },
    { x: 1750, top: 690,  width: 130, lines: 70,  lean: 6 }
];

const FLOOR = 1130;   /* below the frame, so the towers run off the foot */

TOWERS.forEach((tower) => {
    const height = FLOOR - tower.top;

    function pointOn() {
        /* Biased towards the top, which is where the lines pile up. */
        const t = Math.pow(random(), 0.65);
        const y = FLOOR - t * height;
        const spread = tower.width * (1 - t * 0.72);
        const middle = tower.x + tower.lean * t * 3;
        return [middle + (random() - 0.5) * spread, y];
    }

    for (let i = 0; i < tower.lines; i += 1) {
        const [x1, y1] = pointOn();
        const [x2, y2] = pointOn();
        const line = document.createElementNS(
            "http://www.w3.org/2000/svg", "line");
        /* Greys from near-white to black, most of them mid, so the mass
         * reads as a pencil scribble rather than a flat hatch. */
        const grey = Math.round(30 + Math.pow(random(), 1.6) * 170);

        line.setAttribute("x1", x1.toFixed(1));
        line.setAttribute("y1", y1.toFixed(1));
        line.setAttribute("x2", x2.toFixed(1));
        line.setAttribute("y2", y2.toFixed(1));
        line.setAttribute("stroke",
            "rgb(" + grey + "," + grey + "," + grey + ")");
        line.setAttribute("stroke-width", (0.7 + random() * 0.9).toFixed(2));
        towers.appendChild(line);
    }
});
document.title = "ready";
</script>
</body>
</html>
